name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # permite que deploy.yml reutilice este workflow como job

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Validar sintaxis de todos los archivos Python
        run: python -m py_compile app/*.py app/*/*.py lambdas/*.py

      - name: Correr tests (pytest)
        run: pytest -v --tb=short
